<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Docket{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <a class="wordmark" href="/">
                <span class="mark">Docket</span>
                <span class="tag">Job Search</span>
            </a>

            <nav class="nav">
                <a class="nav-item {% if active_nav == 'list' %}active{% endif %}" href="/">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="2.4" rx="1.2" fill="currentColor"/><rect x="2" y="7" width="12" height="2.4" rx="1.2" fill="currentColor"/><rect x="2" y="11" width="8" height="2.4" rx="1.2" fill="currentColor"/></svg>
                    Applications
                </a>
                <a class="nav-item {% if active_nav == 'new' %}active{% endif %}" href="/applications/new">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    Add Application
                </a>
                <a class="nav-item {% if active_nav == 'resume' %}active{% endif %}" href="/resume">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 1.8h5.5L12.5 5v9.2a1 1 0 01-1 1h-7.5a1 1 0 01-1-1V2.8a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/><path d="M5.6 8.2h4.8M5.6 10.6h4.8M5.6 5.8h2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    Resume
                </a>
            </nav>

            <div class="sidebar-spacer"></div>

            {% if resume %}
                <a class="resume-status" href="/resume">
                    <span class="label">Resume on file</span>
                    <span class="file">{{ resume.filename }}</span>
                </a>
            {% else %}
                <a class="resume-status" href="/resume">
                    <span class="label">Resume</span>
                    <span class="file">None uploaded yet</span>
                </a>
            {% endif %}
        </aside>

        <main class="main {% if wide_layout %}main-wide{% endif %}">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
